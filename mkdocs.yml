site_name: Proyecto Proxmox | ASIR
site_description: Proyecto Intermodular de ASIR. Nodo Proxmox, Linux, Bash y Ansible. Curso 2026-2027.
site_url: !ENV [SITE_URL, "http://127.0.0.1:8765/"]
strict: true
not_in_nav: |
  clases/index.md
theme:
  name: material
  language: es
  font: false
  palette:
    scheme: default
    primary: teal
    accent: indigo
  icon:
    logo: material/server-network
  features:
    - navigation.sections
    - navigation.indexes
    - navigation.footer
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
plugins:
  - search:
      lang: es
markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tasklist:
      custom_checkbox: true
extra_css:
  - assets/estilos.css
extra:
  generator: false
nav:
  - Inicio: index.md
  - El proyecto:
      - Primera sesión · GitHub: proyecto/primera-sesion.md
      - Práctica por fases:
          - Guía general: proyecto/practica.md
          - "0. GitHub, Markdown y ficha inicial": proyecto/fase-0-inicio.md
          - "1. Inventario y viabilidad": proyecto/fase-1-inventario.md
          - "2. Diseño de red": proyecto/fase-2-red.md
          - "3. Instalación de Proxmox": proyecto/fase-3-instalacion.md
          - "4. Configuración base del nodo": proyecto/fase-4-configuracion.md
          - "5. Plantilla Linux": proyecto/fase-5-plantilla.md
          - "6. Servidor y cliente": proyecto/fase-6-despliegue.md
          - "7. Servicio ASO": proyecto/fase-7-servicio.md
          - "8. Automatización con Bash y Ansible": proyecto/fase-8-automatizacion.md
          - "9. Copias y restauración": proyecto/fase-9-copias.md
          - "10. Pruebas de rendimiento": proyecto/fase-10-rendimiento.md
          - "11. Pruebas de seguridad": proyecto/fase-11-seguridad.md
          - Memoria, entrega y defensa: proyecto/entrega.md
      - "Comandos: teoría y uso": proyecto/comandos.md
      - Evaluación y defensa: proyecto/evaluacion.md
      - Entrega de Bash y Ansible: proyecto/automatizacion.md
  - Clases:
      #- Calendario e hitos: clases/index.md
      - Presentación del proyecto: clases/presentacion.md
  - Conocer Proxmox:
      - Qué es y qué vas a construir: proxmox/conceptos.md
      - Arquitectura y ciclo de vida: proxmox/arquitectura.md
      - VM, LXC y virtualización anidada: proxmox/virtualizacion.md
      - CPU, memoria y dimensionamiento: proxmox/recursos.md
      - Redes virtuales y recorridos: proxmox/redes-teoria.md
      - Almacenamiento y discos: proxmox/almacenamiento-teoria.md
      - Plantillas, clones e identidad: proxmox/clonado-teoria.md
      - Operación, permisos y recuperación: proxmox/operacion-recuperacion.md
  - Taller de Proxmox:
      - Interfaz y operaciones: proxmox/interfaz.md
      - Instalación de Proxmox: proxmox/instalacion.md
      - Montaje en VirtualBox local: proxmox/virtualbox.md
      - Red y almacenamiento: proxmox/red-almacenamiento.md
      - Plantilla, servidor y cliente: proxmox/plantillas.md
  - Ansible:
      - Modelo y fundamentos: ansible/fundamentos.md
      - Inventario, SSH y privilegios: ansible/inventario-conexion.md
      - YAML, variables y plantillas: ansible/variables-plantillas.md
      - Playbooks, módulos y handlers: ansible/playbooks.md
      - Organización, secretos y validación: ansible/organizacion-validacion.md
      - Laboratorio guiado: ansible/laboratorio.md
  - Recursos:
      - Descargas y plantillas: recursos/descargas.md
      - Resolver incidencias: recursos/incidencias.md
      - Glosario: recursos/glosario.md
      - Fuentes y créditos: recursos/fuentes.md
validation:
  nav:
    omitted_files: warn
    not_found: warn
  links:
    not_found: warn
    unrecognized_links: warn
    anchors: warn
