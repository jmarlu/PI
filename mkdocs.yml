site_name: Proyecto Proxmox | ASIR
site_description: Proyecto Intermodular de ASIR. Nodo Proxmox, Linux, Bash y Ansible. Curso 2026-2027.
site_url: !ENV [SITE_URL, "http://127.0.0.1:8765/"]
strict: true
theme:
  name: material
  language: es
  font: false
  palette:
    scheme: default
    primary: teal
    accent: indigo
  icon:
    logo: material/server-network
  features:
    - navigation.sections
    - navigation.indexes
    - navigation.footer
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
plugins:
  - search:
      lang: es
markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tasklist:
      custom_checkbox: true
extra_css:
  - assets/estilos.css
extra:
  generator: false
nav:
  - Inicio: index.md
  - El proyecto:
      - Primera sesión · GitHub: proyecto/primera-sesion.md
      - Práctica completa: proyecto/practica.md
      - Evaluación y defensa: proyecto/evaluacion.md
  - Clases:
      - Calendario e hitos: clases/index.md
      - Presentación del proyecto: clases/presentacion.md
      - Explicaciones de las 33 sesiones: clases/explicaciones.md
  - Conocer Proxmox:
      - Qué es y qué vas a construir: proxmox/conceptos.md
      - Interfaz y operaciones: proxmox/interfaz.md
      - Instalación física o virtualizada: proxmox/instalacion.md
      - Montaje en VirtualBox local: proxmox/virtualbox.md
      - Red y almacenamiento: proxmox/red-almacenamiento.md
      - Plantilla, servidor y cliente: proxmox/plantillas.md
  - Administrar Linux:
      - Servicio Samba y ACL: linux/servicio-aso.md
      - Scripts Bash y Ansible: linux/automatizacion.md
      - Copias y restauración: linux/copias.md
      - Rendimiento y seguridad: linux/pruebas.md
  - Recursos:
      - Descargas y plantillas: recursos/descargas.md
      - Resolver incidencias: recursos/incidencias.md
      - Glosario: recursos/glosario.md
      - Fuentes y créditos: recursos/fuentes.md
validation:
  nav:
    omitted_files: warn
    not_found: warn
  links:
    not_found: warn
    unrecognized_links: warn
    anchors: warn
