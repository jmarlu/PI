name: Validar y publicar la web
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Instalar MkDocs
        run: python -m pip install -r requirements.txt
      - name: Preparar descargas y comprobar scripts
        run: |
          python tools/preparar_descargas.py
          python -m unittest discover -s tests -v
      - name: Construir
        env:
          SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: |
          python -m mkdocs build --strict
          python tools/comprobar_enlaces.py site
      - name: Validar Ansible sin conectar a servidores
        run: |
          python -m pip install ansible-core==2.21.3
          ansible-galaxy collection install -r docs/recursos/archivos/ansible-samba/requirements.yml
          ansible-playbook -i docs/recursos/archivos/ansible-samba/inventory.ini docs/recursos/archivos/ansible-samba/playbook.yml --syntax-check
      - name: Guardar sitio
        uses: actions/upload-pages-artifact@v4
        with:
          path: site
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
